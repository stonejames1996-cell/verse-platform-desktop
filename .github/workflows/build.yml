# Builds the Windows installer on GitHub's servers.
#   * Every push to main builds a test installer under the Actions tab.
#   * If APP_VERSION in rewind_core.py is new (no release for it yet), it also publishes a
#     GitHub Release tagged vX.Y.Z. So releasing = bump APP_VERSION and push (Release.bat does this).
#     Everyone's app sees the new release and updates itself, and the website's Download button
#     always points at the newest one:
#     https://github.com/<owner>/<repo>/releases/latest/download/VersePlatformSetup.exe
name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is this a new version?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path rewind_core.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "num=$v" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path "release-notes/$v.md")) { throw "Write the patch notes first: release-notes/$v.md is missing" }
          gh release view "v$v" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v is already released, test build only" }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v is new, it will be released" }
          $global:LASTEXITCODE = 0

      - name: Build
        shell: pwsh
        run: ./build.ps1 -CI

      - name: Name the installer for auto update
        shell: pwsh
        run: Copy-Item (Get-ChildItem "Output\Verse Platform Setup *.exe" | Select-Object -First 1).FullName "Output\VersePlatformSetup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Verse-Platform-Setup
          path: Output/VersePlatformSetup.exe

      - name: Publish release
        if: steps.ver.outputs.new == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Verse Platform ${{ steps.ver.outputs.tag }}
          body_path: release-notes/${{ steps.ver.outputs.num }}.md
          files: Output/VersePlatformSetup.exe
          make_latest: true

      # Posts the patch notes to Discord's #platform-updates. Needs the repository secret
      # DISCORD_WEBHOOK_URL (Discord: channel settings, Integrations, Webhooks, Copy Webhook URL).
      # Optional secret DISCORD_PING_ROLE_ID pings the Update Pings role.
      - name: Post patch notes to Discord
        if: steps.ver.outputs.new == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE: ${{ secrets.DISCORD_PING_ROLE_ID }}
        run: |
          if (-not $env:HOOK) { Write-Host "No DISCORD_WEBHOOK_URL secret, skipping"; exit 0 }
          $v = "${{ steps.ver.outputs.num }}"
          $notes = Get-Content "release-notes/$v.md" -Raw
          $body = @{
            username = "Verse Platform Updates"
            avatar_url = "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/logo.png"
            content = $(if ($env:ROLE) { "<@&$($env:ROLE)>" } else { "" })
            allowed_mentions = @{ roles = @($(if ($env:ROLE) { $env:ROLE })) }
            embeds = @(@{
              title = "Verse Platform for Windows $v"
              url = "https://verseplatform.gg/PatchNotes"
              description = $notes.Trim()
              color = 440020
              footer = @{ text = "The app updates itself. New here? Download at verseplatform.gg/Download" }
              timestamp = (Get-Date).ToUniversalTime().ToString("o")
            })
          } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Uri $env:HOOK -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body))
          Write-Host "Posted $v to Discord"

  # Keeps every GitHub release's notes the same as release-notes/<version>.md, so fixing a typo
  # there fixes it on GitHub, the website's Patch notes page and the app's What's new.
  notes:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Sync release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(grep -oP 'APP_VERSION = "\K[^"]+' rewind_core.py)
          first=$(git rev-list --max-parents=0 HEAD | tail -1)
          for f in release-notes/*.md; do
            v=$(basename "$f" .md)
            if gh release view "v$v" >/dev/null 2>&1; then
              gh release edit "v$v" --notes-file "$f" && echo "updated v$v"
            elif [ "$v" != "$current" ] && [ "$(printf '%s\n%s\n' "$v" "$current" | sort -V | head -1)" = "$v" ]; then
              # an older version that never had a GitHub release: add a notes-only one for the history
              gh release create "v$v" --title "Verse Platform v$v" --notes-file "$f" --target "$first" --latest=false && echo "created v$v"
            fi
          done
