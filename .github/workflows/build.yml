# Builds the Windows installer on GitHub's servers.
#   * Every push to main builds a test installer under the Actions tab.
#   * If APP_VERSION in rewind_core.py is new (no release for it yet), it also publishes a
#     GitHub Release tagged vX.Y.Z. So releasing = bump APP_VERSION and push (Release.bat does this).
#     Everyone's app sees the new release and updates itself, and the website's Download button
#     always points at the newest one:
#     https://github.com/<owner>/<repo>/releases/latest/download/VersePlatformSetup.exe
name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is this a new version?
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path rewind_core.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v is already released, test build only" }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v is new, it will be released" }
          $global:LASTEXITCODE = 0

      - name: Build
        shell: pwsh
        run: ./build.ps1 -CI

      - name: Name the installer for auto update
        shell: pwsh
        run: Copy-Item (Get-ChildItem "Output\Verse Platform Setup *.exe" | Select-Object -First 1).FullName "Output\VersePlatformSetup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Verse-Platform-Setup
          path: Output/VersePlatformSetup.exe

      - name: Publish release
        if: steps.ver.outputs.new == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Verse Platform ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: Output/VersePlatformSetup.exe
          make_latest: true
